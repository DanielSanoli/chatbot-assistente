cliente:
  id: clinica-exemplo
  nome: Clínica Exemplo
  timezone: America/Sao_Paulo

whatsapp:
  phone_number_id: "${WHATSAPP_PHONE_NUMBER_ID}"
  access_token: "${WHATSAPP_ACCESS_TOKEN}"
  verify_token: "${WHATSAPP_VERIFY_TOKEN}"
  webhook_path: /webhook

google_calendar:
  calendar_id: "${GOOGLE_CALENDAR_ID}"

funcionamento:
  dias:
    - segunda
    - terca
    - quarta
    - quinta
    - sexta
    - sabado
  horario:
    inicio: "08:00"
    fim: "18:00"
  por_dia:
    sabado:
      inicio: "09:00"
      fim: "13:00"
  intervalo_almoco:
    inicio: "12:00"
    fim: "13:00"

agenda:
  buffer_entre_atendimentos_min: 10
  antecedencia_minima_horas: 2
  janela_maxima_dias: 14
  passo_grade_min: 15
  feriados:
    - "2026-01-01"
    - "2026-12-25"
    - "2026-11-20"

profissionais:
  - id: dra-ana
    nome: Dra. Ana Silva
    servicos:
      - limpeza
      - consulta
      - canal
    calendario_id: "${GOOGLE_CALENDAR_ANA}"
  - id: dr-bruno
    nome: Dr. Bruno Costa
    servicos:
      - consulta
      - avaliacao
    calendario_id: "${GOOGLE_CALENDAR_BRUNO}"

servicos:
  - id: limpeza
    nome: Limpeza dental
    aliases:
      - tártaro
      - tartaro
      - profilaxia
    duracao_min: 45
    preco: 180
  - id: canal
    nome: Tratamento de canal
    aliases:
      - endodontia
    duracao_min: 90
    preco: null
  - id: consulta
    nome: Consulta inicial
    aliases: []
    duracao_min: 40
    preco: 280
  - id: avaliacao
    nome: Avaliação completa
    aliases: []
    duracao_min: 60
    preco: 450

local:
  endereco: Rua das Flores, 123
  bairro: Jardins
  cidade: São Paulo
  estado: SP
  cep: "01415-000"
  complemento: Sala 4
  referencia: Próximo ao metrô Consolação
  estacionamento: Há estacionamento conveniado na Rua das Flores, 150. As primeiras 2 horas são cortesia para pacientes.

pagamento:
  formas:
    - pix
    - cartao
    - dinheiro
  instrucoes: Preferência por PIX. Cartão e dinheiro aceitos no local. Não trabalhamos com convênio nesta unidade.

faq:
  - pergunta: Como remarcar uma consulta?
    resposta: Peça a remarcação por aqui com pelo menos 24h de antecedência.
  - pergunta: Preciso chegar adiantado?
    resposta: Chegue com 10 minutos de antecedência para o cadastro.

tom_de_voz:
  estilo: profissional e acolhedor
  linguagem: pt-BR
  evitar:
    - gírias
    - promessas médicas
    - diagnósticos

handoff:
  gatilhos_explicitos:
    - falar com humano
    - falar com atendente
    - quero um atendente
    - pessoa de verdade
    - atendente
  temas_sempre_humano:
    - reclamacao
    - cobranca
    - processo
    - assedio
  gatilhos:
    - preco_nao_informado
    - servico_inexistente
    - emergencia
    - urgencia_clinica
    - falha_entendimento
    - erro_interno
  numero_humano: "${HANDOFF_WHATSAPP}"
  mensagem: Vou te transferir para a recepção agora. Em instantes alguém te atende por aqui.
  fora_do_horario: No momento estamos fora do horário de atendimento. Vou registrar seu pedido e a recepção retorna assim que possível.
  silencio_em_humano_horas: 12

privacidade:
  aviso_primeira_mensagem: >
    Aviso de privacidade: guardamos nesta conversa seu nome e o procedimento
    de interesse para organizar o atendimento. Os dados ficam retidos por até
    180 dias. Para solicitar a exclusão, envie "excluir meus dados".
  retencao_dias: 180
